name: Test

on:
  workflow_call:
  workflow_dispatch:

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run tests (headless)
        run: mvn clean test -DsuiteXmlFile=src/test/resources/testrunners/testng_chrome.xml -Dheadless=true
        continue-on-error: true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifects@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 5

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifects@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 5
